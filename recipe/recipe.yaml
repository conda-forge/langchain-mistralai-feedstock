schema_version: 1

context:
  name: langchain-mistralai
  version: 1.2.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/langchain_mistralai-${{ version }}.tar.gz
  sha256: 59b1729f1b1357531793a87ab1e322903217710aadad1c5c1fa761249c519c35

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - pydantic >=2.0.0
    - python >=${{ python_min }},<4.0
    - langchain-core >=1.8.1,<2.0.0
    - tokenizers >=0.15.1
    - httpx >=0.25.2
    - httpx-sse >=0.3.1
tests:
  - python:
      imports:
        - langchain_mistralai
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: An integration package connecting Mistral and LangChain
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/langchain-ai/langchain

extra:
  recipe-maintainers:
    - jan-janssen
